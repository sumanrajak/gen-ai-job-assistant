<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="min-h-screen w-full">

    <nav class="bg-white shadow-md sticky top-0 z-50">

            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-indigo-600 flex items-center">
                        <i class="fas fa-robot mr-2"></i>
                        <span>GenAI Job Assistant</span>
                    </a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="/saved-jobs" class="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-md text-sm font-medium" aria-current="page">Saved Jobs</a>
                        <a href="/" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Analysis</a>
                        <a href="/country-list" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Country List</a>
                    </div>

                <!-- Mobile menu button -->
                <div class="-mr-2 flex md:hidden">
                    <button type="button" id="mobile-menu-button" class="bg-white inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-indigo-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" aria-controls="mobile-menu" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>

                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu, show/hide based on menu state. -->
        <div class="md:hidden hidden" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="/saved-jobs" class="bg-indigo-100 text-indigo-700 block px-3 py-2 rounded-md text-base font-medium" aria-current="page">Saved Jobs</a>
                <a href="/" class="text-gray-600 hover:text-indigo-600 block px-3 py-2 rounded-md text-base font-medium">Analysis</a>

    <!-- Main Container -->
    <div class="bg-white rounded-3xl shadow-2xl p-4 sm:p-8 lg:p-12 w-full max-w-7xl h-full mt-8 mb-8 border border-gray-200 mx-auto">
        <!-- Header -->
        <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 text-center flex items-center justify-center mb-6">
            <span class="text-indigo-600 mr-3">
                <i class="fas fa-folder-open"></i>
            </span>
            Saved Job Applications
        </h1>

        <!-- Search and Filter Controls -->
        <div class="flex flex-col gap-4 mb-8">
            <div class="flex flex-col sm:flex-row gap-4">
                <!-- Search Bar -->
                <div class="relative flex-grow">
                    <input type="text" id="search-bar" placeholder="Search by title, company, location..."
                           class="w-full pl-10 pr-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                <!-- Date Filter -->
                <div class="relative">
                    <select id="date-filter" class="w-full sm:w-auto pl-4 pr-10 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none bg-white cursor-pointer">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="7days">Last 7 Days</option>
                        <option value="30days">Last 30 Days</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 pointer-events-none">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                </div>
            </div>

            <!-- Country Tabs -->
            <div id="filter-tabs-container" class="relative">
                <div id="filter-tabs" class="flex items-center gap-2 text-sm overflow-x-auto pb-2 -mb-2">
                    <!-- Tabs will be injected here -->
                </div>
            </div>
        </div>

        <!-- Custom Message Box -->
        <div id="messageBox" class="fixed top-4 right-4 z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
            <div class="p-4 rounded-xl shadow-lg font-semibold text-white bg-green-500">
                <i class="fas fa-check-circle mr-2"></i> Job marked as applied!
            </div>
        </div>
        
        <!-- Accordion Container -->
        <div class="space-y-4" id="jobAccordion">
            <!-- Jobs will be injected here -->
            <div class="p-6 text-center text-gray-500">Loading saved jobs...</div>
        </div>
    </div>

    <script>
        let currentJobs = [];
        let currentActiveFilter = 'All';
        let currentSearchQuery = '';
        let currentDateFilter = 'all';

        async function fetchCountriesApi() {
            let countries= await fetch("/api/sheet-names");
            let countriesData = await countries.json();
            return countriesData.sheet_names;
        }

        async function fetchJobsApi() {
            const response = await fetch("/api/saved-jobs");
            

        if (!response.ok) {
        document.getElementById("jobAccordion").innerHTML = "<p class='p-6 text-center text-red-500'>❌ Failed to load saved jobs.</p>";
        return;
        }

        const jobs = await response.json();
            return jobs;
        }

        async function fetchJobsByCountryApi(country) {
            let  sheet_data = await fetch("/api/sheet-data/"+encodeURIComponent(country));
            if (!sheet_data.ok) {
                document.getElementById("jobAccordion").innerHTML = "<p class='p-6 text-center text-red-500'>❌ Failed to load jobs for " + country + ".</p>";
                return [];
            }
            let jobs = await sheet_data.json();
            console.log("Jobs for country:", country, jobs);
            
            return jobs.data ;
        }

        /**
         * Copies text from a specified HTML element to the clipboard.
         * @param {string} elementId - The ID of the element to copy from.
         * @param {HTMLElement} buttonElement - The button element that was clicked.
         */
        function copyToClipboard(elementId, buttonElement) {
            const element = document.getElementById(elementId);
            const textToCopy = element.innerText || element.value;

            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);

            const originalText = buttonElement.innerHTML;
            buttonElement.innerHTML = '<i class="fas fa-check mr-1"></i> Copied!';
            buttonElement.classList.remove('bg-indigo-600');
            buttonElement.classList.add('bg-green-600');

            setTimeout(() => {
                buttonElement.innerHTML = originalText;
                buttonElement.classList.remove('bg-green-600');
                buttonElement.classList.add('bg-indigo-600');
            }, 2000);
        }

        /**
         * Toggles the visibility of an accordion panel.
         * @param {string} elementId - The ID of the panel to toggle.
         */
        function toggleAccordion(elementId) {
            const panel = document.getElementById(elementId);
            panel.classList.toggle('hidden');
        }

        /**
         * Simulates marking a job as applied.
         * In a real app, this would update the backend.
         * @param {string} jobId - The ID of the job to mark as applied.
         */
        async function markAsApplied(jobId) {
             const response = await fetch('/api/mark-applied', {
                 method: 'POST',
                 headers: { 'Content-Type': 'application/json' },
                 body: JSON.stringify({ job_id: jobId })
             });
             if (!response.ok) {
                 showMessage(`Failed to mark job ${jobId} as applied`, 'error');
                 return;
             }
 
             showMessage("Job marked as applied!", 'success');
             const jobIndex = currentJobs.findIndex(job => String(job.job_id) === String(jobId));
             if (jobIndex !== -1) {
                 currentJobs[jobIndex].is_applied = true;
             }
             renderDashboard();
        }

        async function toggleFlag(jobId, event) {
            event.stopPropagation(); // Prevent accordion from toggling
            const response = await fetch('/api/toggle-flag', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: jobId })
            });

            if (!response.ok) {
                showMessage("Failed to update flag status.", 'error');
                return;
            }

            const jobIndex = currentJobs.findIndex(job => String(job.job_id) === String(jobId));
            if (jobIndex !== -1) {
                currentJobs[jobIndex].is_flagged = !currentJobs[jobIndex].is_flagged;
            }
            showMessage("Flag status updated!", 'success');
            renderDashboard();
        }

        async function updateNotes(jobId) {
            const notesText = document.getElementById(`notes-${jobId}`).value;
            const response = await fetch('/api/update-notes', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: jobId, notes: notesText })
            });

            if (!response.ok) {
                showMessage("Failed to save notes.", 'error');
                return;
            }

            const jobIndex = currentJobs.findIndex(job => String(job.job_id) === String(jobId));
            if (jobIndex !== -1) {
                currentJobs[jobIndex].notes = notesText;
            }
            showMessage("Notes saved successfully!", 'success');
        }

        async function deleteJob(jobId) {
            if (!confirm('Are you sure you want to delete this job record? This action cannot be undone.')) {
                return;
            }

            const response = await fetch(`/api/delete-job/${jobId}`, { method: 'DELETE' });

            if (!response.ok) {
                showMessage("Failed to delete job record.", 'error');
                return;
            }

            currentJobs = currentJobs.filter(job => String(job.job_id) !== String(jobId));
            showMessage("Job record deleted.", 'success');
            renderDashboard();
        }
 
        /**
         * Displays a custom toast-like message.
         * @param {string} message - The message to display.
         * @param {string} type - 'success' or 'error'.
         */
        function showMessage(message, type = 'success') {
            const messageBox = document.getElementById('messageBox');
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-times-circle';
            messageBox.innerHTML = `
                <div class="p-4 rounded-xl shadow-lg font-semibold text-white ${bgColor}">
                    <i class="fas ${icon} mr-2"></i> ${message}
                </div>
            `;
            messageBox.classList.remove('opacity-0', 'pointer-events-none');
            messageBox.classList.add('opacity-100');

            setTimeout(() => {
                messageBox.classList.remove('opacity-100');
                messageBox.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        /**
         * Renders the jobs dashboard with applied filters.
         */
        function renderDashboard() {
            const container = document.getElementById("jobAccordion");

            const filteredJobs = currentJobs.filter(job => {
                // Search filter
                const matchesSearch = currentSearchQuery === '' || 
                                      job.Job_Title.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                                      job.company_name.toLowerCase().includes(currentSearchQuery.toLowerCase()) ||
                                      job.location.toLowerCase().includes(currentSearchQuery.toLowerCase());

                // Date filter
                let matchesDate = true;
                if (currentDateFilter !== 'all') {
                    const jobDate = new Date(job["Date Saved"]);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    if (currentDateFilter === 'today') {
                        matchesDate = jobDate >= today;
                    } else {
                        const daysAgo = currentDateFilter === '7days' ? 7 : 30;
                        const pastDate = new Date(today);
                        pastDate.setDate(today.getDate() - daysAgo);
                        matchesDate = jobDate >= pastDate;
                    }
                }

                return matchesSearch && matchesDate;
            });

            if (!filteredJobs.length) {
                container.innerHTML = "<p class='p-6 text-center text-gray-500'>No saved jobs match the current filters.</p>";
                return;
            }

            container.innerHTML = "";
            filteredJobs.forEach((job, index) => {
                const isApplied = job.is_applied;
                const isFlagged = job.is_flagged;
                const jobId = `job-${index}`;
                
                // Determine status badge classes
                const statusBadgeClasses = isApplied 
                    ? "bg-green-500 text-white" 
                    : "bg-yellow-400 text-gray-800";
                const statusBadgeText = isApplied ? "Applied" : "Pending";

                // Determine flag icon classes
                const flagIconClasses = isFlagged ? 'text-yellow-500' : 'text-gray-400';

                // Determine fit score card classes
                const score = parseInt(job.fit_score);
                let cardClasses = '';
                if (score >= 8) {
                    cardClasses = 'from-green-500 to-emerald-600';
                } else if (score >= 5) {
                    cardClasses = 'from-yellow-500 to-orange-500';
                } else {
                    cardClasses = 'from-red-500 to-rose-600';
                }

                const card = document.createElement("div");
                card.className = "rounded-xl shadow-lg border border-gray-200 overflow-hidden";
                
                let recruiterUrls = job.recruiter_linkedin_urls;
                if (recruiterUrls && typeof recruiterUrls === 'string') {
                    try {
                        // Handle cases where the API returns a stringified array
                        recruiterUrls = JSON.parse(recruiterUrls);
                    } catch (e) {
                        console.error(`Failed to parse recruiter_linkedin_urls for job ${job.job_id}:`, recruiterUrls);
                        recruiterUrls = [];
                    }
                }

                const recruiterLinks = (recruiterUrls && recruiterUrls.length > 0) 
                    ? recruiterUrls.map(link => `
                        <li>
                            <a href="${link}" target="_blank" class="text-indigo-600 hover:underline">
                                ${link}
                            </a>
                        </li>
                    `).join('')
                    : `<li class="text-gray-500">No recruiters found.</li>`;

                card.innerHTML = `
                    <div class="accordion-header bg-gray-50 flex items-center justify-between p-4 cursor-pointer hover:bg-gray-100 transition-colors"
                         onclick="toggleAccordion('collapse-${jobId}')">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 flex-wrap">
                                <h2 class="text-lg font-semibold text-gray-800">${job.Job_Title} @ ${job.company_name}</h2>
                                <span class="text-xs font-bold px-2 py-1 rounded-full ${statusBadgeClasses}">${statusBadgeText}</span>
                                <button onclick="toggleFlag('${job.job_id}', event)" class="${flagIconClasses} hover:text-yellow-500 transition-colors text-lg" title="Flag this job">
                                    <i class="fas fa-flag"></i>
                                </button>
                            </div>
                            <div class="text-sm text-gray-500 mt-1">${job.location}, ${job.location_country}</div>
                        </div>
                        <div class="w-20 h-10 rounded-full flex items-center justify-center font-bold text-white text-xl bg-gradient-to-br ${cardClasses} shadow-md">
                            ${job.fit_score || 'N/A'}
                        </div>
                    </div>
                    <div id="collapse-${jobId}" class="p-6 transition-all duration-300 hidden">
                        <div class="space-y-6 text-gray-700">

                            <!-- Job Details -->
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                <h3 class="font-bold text-lg text-indigo-600 mb-2 flex items-center gap-2">
                                    <i class="fas fa-info-circle"></i> Job Details
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2">
                                    <p><strong>Date Saved:</strong> ${job["Date Saved"]}</p>
                                    <p><strong>Fit Score:</strong> <span class="font-semibold">${job.fit_score || 'N/A'}</span></p>
                                    <p class="sm:col-span-2"><strong>Matched Skills:</strong> ${job.fit_matched_skills}</p>
                                    <p class="sm:col-span-2"><strong>Missing Skills:</strong> ${job.fit_missing_skills}</p>
                                    <p class="sm:col-span-2"><strong>Summary:</strong> ${job.fit_summary}</p>
                                    <p class="sm:col-span-2"><strong>Job URL:</strong> <a href="${job.job_url}" target="_blank" class="text-indigo-600 hover:underline">Open Job Posting</a></p>
                                </div>
                            </div>
                            
                            <!-- Communication Templates -->
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                <h3 class="font-bold text-lg text-indigo-600 mb-2 flex items-center gap-2">
                                    <i class="fas fa-paper-plane"></i> Communication Templates
                                </h3>
                                
                                <div class="space-y-4">
                                    <!-- Cold Email -->
                                    <div>
                                        <p class="font-semibold text-gray-900 mb-1">Cold Email Subject: <span id="coldEmailSubject-${jobId}">${job.email_cold_subject}</span></p>
                                        <div class="relative">
                                            <pre id="coldEmailBody-${jobId}" class="bg-white p-4 rounded-xl border border-gray-300 text-gray-800">${job.email_cold_body || 'N/A'}</pre>
                                            <button onclick="copyToClipboard('coldEmailBody-${jobId}', this)" class="absolute top-2 right-2 bg-indigo-600 text-white font-semibold py-1 px-3 rounded-md transition-colors text-sm hover:bg-indigo-700">
                                                <i class="fas fa-copy"></i> Copy
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Cover Letter -->
                                    <div>
                                        <p class="font-semibold text-gray-900 mb-1">Cover Letter Body:</p>
                                        <div class="relative">
                                            <pre id="coverLetterBody-${jobId}" class="bg-white p-4 rounded-xl border border-gray-300 text-gray-800">${job.cover_letter_body || 'N/A'}</pre>
                                            <button onclick="copyToClipboard('coverLetterBody-${jobId}', this)" class="absolute top-2 right-2 bg-indigo-600 text-white font-semibold py-1 px-3 rounded-md transition-colors text-sm hover:bg-indigo-700">
                                                <i class="fas fa-copy"></i> Copy
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <!-- LinkedIn Messages -->
                                    <div>
                                        <p class="font-semibold text-gray-900 mb-1">LinkedIn Recruiter Message:</p>
                                        <div class="relative">
                                            <pre id="linkedinRecruiterMessageBody-${jobId}" class="bg-white p-4 rounded-xl border border-gray-300 text-gray-800">${job.linkedin_message_recruiter || 'N/A'}</pre>
                                            <button onclick="copyToClipboard('linkedinRecruiterMessageBody-${jobId}', this)" class="absolute top-2 right-2 bg-indigo-600 text-white font-semibold py-1 px-3 rounded-md transition-colors text-sm hover:bg-indigo-700">
                                                <i class="fas fa-copy"></i> Copy
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <p class="font-semibold text-gray-900 mb-1">LinkedIn Referrer Message:</p>
                                        <div class="relative">
                                            <pre id="linkedinReferrerMessageBody-${jobId}" class="bg-white p-4 rounded-xl border border-gray-300 text-gray-800">${job.linkedin_message_referrer || 'N/A'}</pre>
                                            <button onclick="copyToClipboard('linkedinReferrerMessageBody-${jobId}', this)" class="absolute top-2 right-2 bg-indigo-600 text-white font-semibold py-1 px-3 rounded-md transition-colors text-sm hover:bg-indigo-700">
                                                <i class="fas fa-copy"></i> Copy
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <!-- Company Insights -->
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                <h3 class="font-bold text-lg text-indigo-600 mb-2 flex items-center gap-2">
                                    <i class="fas fa-building"></i> Company Insights
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2">
                                    <p><strong>Company Size:</strong> ${job.org_company_size || 'N/A'}</p>
                                    <p><strong>Avg. Salary (SE):</strong> ${job.org_avg_salary_se || 'N/A'}</p>
                                    <p class="sm:col-span-2"><strong>Recent Layoffs:</strong> ${job.org_recent_layoffs || 'N/A'}</p>
                                    <p class="sm:col-span-2"><strong>Recruiter LinkedIn URLs:</strong></p>
                                    <ul class="list-disc pl-5 sm:col-span-2 space-y-1">
                                        ${recruiterLinks}
                                    </ul>
                                </div>
                            </div>

                            <!-- Personal Notes -->
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                <h3 class="font-bold text-lg text-indigo-600 mb-2 flex items-center gap-2">
                                    <i class="fas fa-sticky-note"></i> Personal Notes
                                </h3>
                                <textarea id="notes-${job.job_id}" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none" rows="4" placeholder="Add your personal notes here...">${job.notes || ''}</textarea>
                                <button onclick="updateNotes('${job.job_id}')" class="mt-2 px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors text-sm">
                                    <i class="fas fa-save mr-1"></i> Save Notes
                                </button>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex items-center gap-4 mt-6">
                                ${!isApplied ? `<button class="flex-grow px-4 py-3 font-bold text-white bg-green-600 rounded-xl hover:bg-green-700 transition-colors shadow-md" onclick="markAsApplied('${job.job_id}')">
                                    <i class="fas fa-check-circle mr-2"></i> Mark as Applied
                                </button>` : '<div class="flex-grow"></div>'}
                                <button class="flex-shrink-0 px-4 py-3 font-bold text-white bg-red-600 rounded-xl hover:bg-red-700 transition-colors shadow-md" onclick="deleteJob('${job.job_id}')" title="Delete Job Record">
                                    <i class="fas fa-trash-alt mr-2"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        /**
         * Renders the country tabs based on the API data.
         */
        async function renderFilterTabs() {
            const tabsContainer = document.getElementById('filter-tabs');
            tabsContainer.innerHTML = "<div class='p-2 text-center text-gray-500'>Loading filters...</div>";
            
            const countries = await fetchCountriesApi();
            const allFilters = ['All', 'Flagged', ...countries];

            tabsContainer.innerHTML = allFilters.map(filter => {
                const filterId = filter.replace(/\s/g, '-');
                const icon = filter === 'Flagged' ? '<i class="fas fa-flag mr-2"></i>' : '';
                return `
                    <button onclick="setActiveFilter('${filter}')"
                            id="tab-${filterId}"
                            class="flex-shrink-0 px-4 py-2 rounded-full font-semibold transition-colors flex items-center
                            ${filter === currentActiveFilter ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">
                        ${icon}${filter}
                    </button>
                `;
            }).join('');
        }

        /**
         * Sets the active country filter and re-renders the dashboard.
         * @param {string} filter - The filter to apply ('All', 'Flagged', or a country name).
         */
        async function setActiveFilter(filter) {
            currentActiveFilter = filter;
            currentSearchQuery = '';
            document.getElementById('search-bar').value = '';
            renderFilterTabs(); // Update the active tab styling

            const container = document.getElementById("jobAccordion");
            container.innerHTML = `<div class='p-6 text-center text-gray-500'>Loading jobs for "${filter}"...</div>`;

            try {
                if (filter === 'All') {
                    currentJobs = await fetchJobsApi();
                } else if (filter === 'Flagged') {
                    const allJobs = await fetchJobsApi();
                    currentJobs = allJobs.filter(job => job.is_flagged);
                } else { // It's a country filter
                    currentJobs = await fetchJobsByCountryApi(filter);
                }
                renderDashboard();
            } catch (error) {
                console.error("Failed to fetch jobs:", error);
                container.innerHTML = "<p class='p-6 text-center text-red-500'>❌ Failed to load jobs.</p>";
            }
        }

        // Initial render on page load
        (async () => {
            // Hamburger menu logic
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenuButton.addEventListener('click', () => {
                const isExpanded = mobileMenuButton.getAttribute('aria-expanded') === 'true';
                mobileMenuButton.setAttribute('aria-expanded', !isExpanded);
                mobileMenu.classList.toggle('hidden');
                mobileMenuButton.querySelector('i').classList.toggle('fa-bars');
                mobileMenuButton.querySelector('i').classList.toggle('fa-times');
            });

            // Search bar listener
            document.getElementById('search-bar').addEventListener('input', (event) => {
                currentSearchQuery = event.target.value;
                renderDashboard();
            });

            // Date filter listener
            document.getElementById('date-filter').addEventListener('change', (event) => {
                currentDateFilter = event.target.value;
                renderDashboard();
            });

            await renderFilterTabs();
            await setActiveFilter('All');
        })();
    </script>
</body>
</html>
