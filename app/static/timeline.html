        function updateISTClock() {
            const now = new Date();
            const istOffset = 5.5 * 60 * 60 * 1000;
            const istTime = new Date(now.getTime() + istOffset - (now.getTimezoneOffset() * 60 * 1000));
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            document.getElementById('ist-clock').textContent = istTime.toLocaleString('en-US', options) + ' IST';
        }

        function createCountryCard(countryName, data, status, countdown = '') {
            const card = document.createElement('div');
            card.className = 'bg-white p-6 rounded-lg shadow-lg border border-gray-200 transition-transform hover:scale-105';

            let statusBadgeClasses = 'py-1 px-3 rounded-full text-xs font-bold uppercase';
            let statusText = '';
            if (status === 'active') {
                statusBadgeClasses += ' bg-green-500 text-white';
                statusText = 'Active Now';
            } else {
                statusBadgeClasses += ' bg-yellow-400 text-gray-800';
                statusText = `Next Up: ${countdown}`;
            }

            const portalsHtml = data.job_portals.map(p =>
                `<a href="${p.url}" target="_blank" class="text-indigo-600 hover:underline font-semibold">${p.name}</a>`
            ).join(', ');

            const companiesHtml = data.target_companies.map(c =>
                `<span class="bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded-full">${c}</span>`
            ).join('');

            card.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-bold text-gray-900">${countryName}</h3>
                    <span class="${statusBadgeClasses}">${statusText}</span>

                            <span class="bg-gray-100 text-gray-600 text-xs p-2 rounded-md font-mono flex-grow overflow-x-auto whitespace-nowrap scrollbar-hide" id="google-${countryName}">${data.google_search}</span>
                            <button class="flex-shrink-0 bg-indigo-500 text-white px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-indigo-600 transition-colors duration-200 copy-btn" data-target="google-${countryName}">Copy</button>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(data.google_search)}" target="_blank" class="flex-shrink-0 bg-gray-300 text-gray-800 px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-gray-400 transition-colors duration-200 text-center">Open</a>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function parseTime(timeString) {
            const [hours, minutes] = timeString.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function checkTimeSlot(timeSlots, currentMinutes) {
            for (const slot of timeSlots) {
                const [start, end] = slot.split(' - ').map(parseTime);
                if (start <= end) {
                    if (currentMinutes >= start && currentMinutes < end) {
                        return true;
                    }
                } else { // Handle overnight slots
                    if (currentMinutes >= start || currentMinutes < end) {
                        return true;
                    }
                }
            }
            return false;
        }

        function calculateCountdown(timeSlots, currentMinutes) {
            let minDiff = Infinity;
            let foundNextSlot = false;

            for (const slot of timeSlots) {
                const [start, end] = slot.split(' - ').map(parseTime);
                let diff;
                if (currentMinutes < start) {
                    diff = start - currentMinutes;
                } else { // Current time is past the slot for today
                    const endToday = 24 * 60;
                    const diffToday = endToday - currentMinutes + start;
                    diff = diffToday;
                }
                if (diff > 0 && diff < minDiff) {
                    minDiff = diff;
                    foundNextSlot = true;
                }
            }

            if (!foundNextSlot) {
                return '24h 0m'; // Default if no future slots found
            }

            const hours = Math.floor(minDiff / 60);
            const minutes = minDiff % 60;
            return `${hours}h ${minutes}m`;
        }

        function updateDashboard() {
            const now = new Date();
            const istHours = now.getUTCHours() + 5;
            const istMinutes = now.getUTCMinutes() + 30;
            const currentMinutesIST = (istHours * 60) + istMinutes;

            activeNowCardsContainer.innerHTML = '';
            nextUpCardsContainer.innerHTML = '';

            let activeCount = 0;
            let nextUpCount = 0;

            for (const [country, data] of Object.entries(countryData)) {
                if (checkTimeSlot(data.best_time_slots_IST, currentMinutesIST)) {
                    activeNowCardsContainer.appendChild(createCountryCard(country, data, 'active'));
                    activeCount++;
                } else {
                    const countdown = calculateCountdown(data.best_time_slots_IST, currentMinutesIST);
                    nextUpCardsContainer.appendChild(createCountryCard(country, data, 'next-up', countdown));
                    nextUpCount++;
                }
            }
            
            document.getElementById('active-now-heading').textContent = `Active Now (${activeCount})`;
            document.getElementById('next-up-heading').textContent = `Next Up (${nextUpCount})`;

            handleFilter();
        }

        function handleFilter() {
            if (isShowAll) {
                activeNowSection.style.display = 'block';
                nextUpSection.style.display = 'block';
                activeNowBtn.classList.remove('bg-indigo-600', 'text-white');
                activeNowBtn.classList.add('bg-gray-200', 'text-gray-700');
                showAllBtn.classList.add('bg-indigo-600', 'text-white');
                showAllBtn.classList.remove('bg-gray-200', 'text-gray-700');
            } else {
                activeNowSection.style.display = 'block';
                nextUpSection.style.display = 'none';
                activeNowBtn.classList.add('bg-indigo-600', 'text-white');
                activeNowBtn.classList.remove('bg-gray-200', 'text-gray-700');
                showAllBtn.classList.remove('bg-indigo-600', 'text-white');
                showAllBtn.classList.add('bg-gray-200', 'text-gray-700');
            }
        }
        
        document.addEventListener('click', function(event) {
            if (event.target.id === 'active-now-btn') {
                isShowAll = false;
                handleFilter();
            } else if (event.target.id === 'show-all-btn') {
                isShowAll = true;
                handleFilter();
            }
            
            if (event.target.classList.contains('copy-btn')) {
                const targetId = event.target.dataset.target;
                const textToCopy = document.getElementById(targetId).textContent;
                
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = textToCopy;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextarea);

                const originalText = event.target.textContent;
                event.target.textContent = 'Copied!';
                setTimeout(() => {
                    event.target.textContent = originalText;
                }, 1500);
            }
        });

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            menuIconBars.classList.toggle('hidden');
            menuIconTimes.classList.toggle('hidden');
        });

        window.onload = function() {
            updateISTClock();
            setInterval(updateISTClock, 1000);
            updateDashboard();
            setInterval(updateDashboard, 30000);
        };

    </script>
</body>
</html>
