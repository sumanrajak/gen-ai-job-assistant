            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            const menuOpenIcon = document.getElementById('menu-open-icon');
            const menuCloseIcon = document.getElementById('menu-close-icon');
            const container = document.querySelector('#accordion-container');
            const searchInput = document.querySelector('#searchInput');

            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                menuOpenIcon.classList.toggle('hidden');
                menuCloseIcon.classList.toggle('hidden');
            });

            function createLinkList(links, title) {
                if (!links || links.length === 0) return '';
                const listItems = links.map(link => {
                    const cleanLink = link.split(' ')[0];
                    const displayText = link;
                    return `<li class="mb-2"><a href="${cleanLink}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-800 hover:underline break-all">${displayText}</a></li>`;
                }).join('');
                const buttonHtml = links.length > 0 ? `<button class="link-button mt-4 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition text-sm font-medium" data-links='${JSON.stringify(links)}'>Open All Links</button>` : '';
                return `
                    <div class="content-section mb-6">
                        <h3 class="text-lg font-semibold text-gray-700 mb-3">${title}</h3>
                        <ul class="list-none p-0 m-0">${listItems}</ul>
                        ${buttonHtml}
                    </div>
                `;
            }

            function createTextList(items, title) {
                if (!items || items.length === 0) return '';
                const listItems = items.map(item => `<li class="mb-1 bg-indigo-50 text-indigo-800 rounded-full px-3 py-1 inline-block text-sm font-medium">${item}</li>`).join(' ');
                return `
                    <div class="content-section mb-6">
                        <h3 class="text-lg font-semibold text-gray-700 mb-3">${title}</h3>
                        <ul class="list-none p-0 m-0 flex flex-wrap gap-2">${listItems}</ul>
                    </div>
                `;
            }

            function createAccordionItem(countryName, countryData) {
                const item = document.createElement('div');
                item.className = `accordion-item bg-white rounded-xl shadow-md overflow-hidden transition-shadow duration-300 hover:shadow-lg`;

                const button = document.createElement('button');
                button.className = 'accordion-button w-full p-5 text-left text-xl font-bold text-gray-800 flex justify-between items-center';
                button.innerHTML = `
                    <span>${countryName}</span>
                    <i class="icon fas fa-chevron-down transition-transform duration-300"></i>
                `;
                item.appendChild(button);

                const content = document.createElement('div');
                content.className = 'accordion-content max-h-0';

                const contentInner = document.createElement('div');
                contentInner.className = 'accordion-content-inner p-5 border-t border-gray-200';

                contentInner.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="content-section">
                            <h3 class="text-lg font-semibold text-gray-700 mb-2">Expected Salary</h3>
                            <p class="text-gray-600"><strong class="font-medium text-gray-700">Local:</strong> ${countryData.expected_salary_as_per_current_salary_local}</p>
                            <p class="text-gray-600"><strong class="font-medium text-gray-700">In INR:</strong> ${countryData.expected_salary_as_per_current_salary_in_inr}</p>
                        </div>
                        <div class="content-section">
                            <h3 class="text-lg font-semibold text-gray-700 mb-2">Average Full Stack Salary</h3>
                            <p class="text-gray-600"><strong class="font-medium text-gray-700">Local:</strong> ${countryData.avg_salaries_full_stack_local_currency}</p>
                            <p class="text-gray-600"><strong class="font-medium text-gray-700">In INR:</strong> ${countryData.avg_salaries_full_stack_in_inr}</p>
                        </div>
                    </div>
                    ${createLinkList(countryData.job_portals, 'Job Portals')}
                    ${createLinkList(countryData.hiring_agencies_links, 'Hiring Agencies')}
                    ${createTextList(countryData.cities_to_target, 'Cities to Target')}
                `;
                content.appendChild(contentInner);
                item.appendChild(content);

                return item;
            }

            function renderAccordions(dataToRender) {
                container.innerHTML = ''; // Clear existing content
                if (Object.keys(dataToRender).length === 0) {
                    container.innerHTML = `<p class="text-center text-gray-500 text-lg">No countries found matching your search.</p>`;
                    return;
                }

                const countryKeys = Object.keys(dataToRender);
                
                const twoColumnLayout = document.createElement('div');
                twoColumnLayout.className = 'grid grid-cols-1 md:grid-cols-2 gap-6';

                countryKeys.forEach(country => {
                    const accordionItem = createAccordionItem(country, dataToRender[country]);
                    twoColumnLayout.appendChild(accordionItem);
                });

                container.appendChild(twoColumnLayout);

                document.querySelectorAll('.accordion-button').forEach(button => {
                    button.addEventListener('click', () => {
                        const content = button.nextElementSibling;
                        const icon = button.querySelector('.icon');
                        
                        button.classList.toggle('active');
                        icon.classList.toggle('rotate-180');

                        if (content.style.maxHeight) {
                            content.style.maxHeight = null;
                        } else {
                            content.style.maxHeight = content.scrollHeight + 'px';
                        }
                    });
                });

                document.querySelectorAll('.link-button').forEach(button => {
                    button.addEventListener('click', (event) => {
                        event.stopPropagation();
                        const links = JSON.parse(event.target.dataset.links);
                        links.forEach(link => {
                            const actualLink = link.split(' ')[0]; 
                            window.open(actualLink, '_blank', 'noopener noreferrer');
                        });
                    });
                });
            }

            renderAccordions(data);

            searchInput.addEventListener('keyup', (event) => {
                const searchTerm = event.target.value.toLowerCase();
                const filteredData = {};

                for (const country in data) {
                    if (data.hasOwnProperty(country)) {
                        const countryData = data[country];
                        const countryName = countryData.country_name.toLowerCase();
                        const cities = countryData.cities_to_target.map(city => city.toLowerCase());

                        if (countryName.includes(searchTerm) || cities.some(city => city.includes(searchTerm))) {
                            filteredData[country] = countryData;
                        }
                    }
                }
                renderAccordions(filteredData);
            });
        })();
    </script>
